Help.Title="LiveDelay – so verbindest du es"
Help.RouteNow="OBS jetzt einrichten"
Help.Close="Schließen"
Help.Body="<h3>LiveDelay in 4 Schritten verbinden</h3><ol><li><b>OBS auf LiveDelay umstellen.</b> Klicke unten <i>OBS jetzt einrichten</i>. Dein aktueller Server und Stream-Key wandern zu LiveDelay, und OBS sendet an <code>rtmp://127.0.0.1:1935/live</code>. Von Hand: Einstellungen → Stream → Dienst <i>Benutzerdefiniert</i>, dieser Server, beliebiger Key.</li><li><b>Plattformen prüfen.</b> In den <i>Einstellungen</i> weitere hinzufügen (Twitch, YouTube, Kick…) und wählen, welche automatisch mit dem Stream starten.</li><li><b>Stream in OBS starten</b> wie gewohnt. Das Dock wechselt von <i>Warte auf Stream von OBS</i> zu <i>LIVE</i>.</li><li><b>Verzögerung nutzen.</b> Sekunden einstellen, <i>Arm</i> drücken, auf <i>bereit</i> warten, dann <i>Activate</i>. <i>Cut</i> bringt dich zurück zu live.</li></ol><p><b>Extras.</b> Hotkeys: Einstellungen → Hotkeys → „LiveDelay: …“ (Numpad, Stream Deck). Overlay für Zuschauer: Browser-Quelle mit <code>%1</code>. Was gesendet wird: der Knopf <i>Vorschau</i>.</p>"
Settings.RoutedNoTarget="In OBS war kein Server oder Key eingetragen, also gab es nichts zu übernehmen. OBS sendet jetzt an LiveDelay. Füge deine Plattform in der Liste hinzu: Vorlage wählen, Stream-Key einfügen, Speichern."
