[package]
name = "livedelay"
version = "1.0.2"
license = "GPL-2.0-or-later"
edition = "2021"
description = "Lekki przełącznik opóźnienia streamu dla OBS (proxy RTMP z buforem w RAM)."

[dependencies]
tokio = { version = "1", default-features = false, features = ["rt", "net", "io-util", "sync", "time", "macros"] }
# TLS dla rtmps:// (Kick, YouTube). Używa systemowego schannel, więc nie dokłada własnego stosu TLS.
tokio-native-tls = "0.3"

[lib]
# staticlib: linked into the OBS plugin DLL; rlib: used by the tray app.
crate-type = ["staticlib", "rlib"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
# No "abort": inside OBS a panic in one task must not take the whole app down.

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
