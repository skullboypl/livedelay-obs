[package]
name = "livedelay"
version = "1.0.31"
license = "GPL-2.0-or-later"
edition = "2021"
description = "Lekki przełącznik opóźnienia streamu dla OBS (proxy RTMP z buforem w RAM)."
autobins = false

# Old Rust tray host. The new window is livedelay-standalone-app. A separate
# name so its pdb does not collide with livedelay.dll.
[[bin]]
name = "livedelay-tray"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", default-features = false, features = ["rt", "net", "io-util", "sync", "time", "macros"] }
# TLS dla rtmps:// (Kick, YouTube). Używa systemowego schannel, więc nie dokłada własnego stosu TLS.
tokio-native-tls = "0.3"

[lib]
# staticlib: linked into the OBS plugin DLL.
# rlib: used by the old Rust tray binary in this repo.
# cdylib: livedelay.dll, the same engine loaded by livedelay-standalone-app.
# Do not copy this crate into the app repo. See AGENTS.md.
crate-type = ["staticlib", "rlib", "cdylib"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
# No "abort": inside OBS a panic in one task must not take the whole app down.

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
