Help.Title="LiveDelay – jak podłączyć"
Help.RouteNow="Ustaw OBS teraz"
Help.Close="Zamknij"
Help.Body="<h3>Podłącz LiveDelay w 4 krokach</h3><ol><li><b>Ustaw OBS na LiveDelay.</b> Kliknij <i>Ustaw OBS teraz</i> poniżej. Obecny serwer i klucz streamu trafią do LiveDelay, a OBS będzie nadawał na <code>rtmp://127.0.0.1:1935/live</code>. Ręcznie: Ustawienia → Transmisja → Usługa <i>Własna</i>, ten serwer, dowolny klucz.</li><li><b>Sprawdź platformy.</b> W <i>Ustawieniach</i> dodasz kolejne (Twitch, YouTube, Kick…) i wybierzesz, które startują automatycznie ze streamem.</li><li><b>Rozpocznij transmisję w OBS</b> jak zwykle. Panel zmieni się z <i>Czekam na stream z OBS</i> na <i>NA ŻYWO</i>.</li><li><b>Używaj opóźnienia.</b> Ustaw sekundy, kliknij <i>Uzbrój</i>, poczekaj na <i>uzbrojone</i>, potem <i>Włącz opóźnienie</i>. <i>Na żywo</i> wraca bez opóźnienia.</li></ol><p><b>Dodatki.</b> Skróty: Ustawienia → Skróty klawiszowe → „LiveDelay: …” (numpad, Stream Deck). Overlay dla widzów: źródło Przeglądarka z adresem <code>%1</code>. Co jest wysyłane: przycisk <i>Podgląd</i>.</p>"
Settings.RoutedNoTarget="W OBS nie było ustawionego serwera ani klucza, więc nie było czego przenieść. OBS nadaje teraz do LiveDelay. Dodaj platformę na liście: wybierz szablon, wklej klucz streamu i kliknij Zapisz."
