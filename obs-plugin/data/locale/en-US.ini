Encode.VodAudioTip="Second AAC from OBS Advanced Output → Twitch VOD Track. Live keeps the full mix; the VOD uses the other track."
Encode.VodAudioHelp="<b>Split music off the Twitch VOD</b><br>1. OBS → Settings → Output → Output Mode: <b>Advanced</b>.<br>2. Streaming tab: turn on <b>Twitch VOD Track</b> and pick a track that is not the live one (usually 2).<br>3. In Edit → Advanced Audio Properties, mute music on that VOD track only. Leave the full mix on the live track.<br>4. Check this box on the Twitch destination and save. LiveDelay sends that track as a second AAC. Viewers hear everything; the VOD does not get the muted sources.<br>Twitch only. YouTube and Kick ignore this box."
Encode.Enhanced="Enhanced Broadcasting (beta)"
Encode.EnhancedTip="Beta. Asks Twitch for a GoLive session and sends the qualities Twitch returns, through the same delay. If Twitch does not answer, LiveDelay stays on one video track. Kick and YouTube stay on one track."
