Encode.VodAudioTip="Drugi AAC z OBS → Wyjście zaawansowane → Ścieżka VOD Twitch. Na żywo pełny mix, na VOD druga ścieżka."
Encode.VodAudioHelp="<b>Jak zdjąć muzykę z VOD na Twitchu</b><br>1. OBS → Ustawienia → Wyjście → tryb <b>Zaawansowany</b>.<br>2. Karta Transmisja: włącz <b>Ścieżka VOD Twitch</b> i wybierz inną ścieżkę niż live (zwykle 2).<br>3. Edycja → Zaawansowane właściwości audio: wycisz muzykę tylko na ścieżce VOD. Na ścieżce live zostaw pełny mix.<br>4. Zaznacz ten checkbox przy platformie Twitch i zapisz. LiveDelay wyśle ją jako drugi AAC. Widzowie słyszą wszystko, VOD nie dostaje wyciszonych źródeł.<br>Tylko Twitch. YouTube i Kick ignorują to pole."
