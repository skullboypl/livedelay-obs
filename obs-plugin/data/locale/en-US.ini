WhatsNew.Title="What's new in LiveDelay %1"
WhatsNew.From="Updated from %1."
WhatsNew.FromEarlier="Updated from an earlier version of LiveDelay."
WhatsNew.Ok="Got it"
WhatsNew.Body1031="<p><b>Twitch Enhanced Broadcasting (beta).</b> On a Twitch destination, the checkbox asks Twitch for a GoLive session and sends the quality ladder Twitch returns. Arm, Activate and Cut move every quality together. If Twitch does not return a session, LiveDelay keeps one video track on the normal ingest. Kick and YouTube stay on one track. OBS's own Enhanced Broadcasting stays off, because a custom server has no GoLive address.</p><p><b>Dark theme text stays readable.</b> Hints, the dock status and the help windows take their color from the OBS theme, so they no longer show up black on black.</p>"
WhatsNew.Body1030="<p><b>LiveDelay no longer checks in with the website.</b> The plugin does not send a signal that it is open. The count of running copies is gone. Aside from update checks and missing translations, nothing is sent just to count you.</p><p><b>Each platform has its own audio track.</b> On a platform, Live audio track picks OBS track 1 through 6. That is what viewers of that platform hear. Same as OBS keeps the track from Settings, Output.</p><p><b>The Twitch VOD track is a second audio stream.</b> Pick a track that is not the live one. LiveDelay sends it as a second AAC. Viewers keep the first track, and Twitch can store the second in the VOD. After Arm, Activate and Cut the header for that track is sent again, so the VOD audio survives the delay jump.</p><p><b>Which source goes to which track.</b> The Audio tab lists the mic, desktop, music and the other sources. Each one can sit on tracks 1–6. To keep music out of the VOD, leave it on the live track and clear it on the VOD track. YouTube and Kick do not use the VOD track. Source assignments stay in the OBS scene collection.</p>"
