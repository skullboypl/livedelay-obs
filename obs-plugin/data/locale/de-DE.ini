Wizard.PlatformsBody="Hake die Plattformen an, die das vertikale Bild bekommen sollen. Eine angehakte Plattform nimmt ihr Bild dann nicht mehr aus OBS."
Wizard.AddTikTok="TikTok hinzufügen"
Wizard.AddTikTokTip="Fügt eine TikTok-Plattform auf diesem Eingang hinzu. Adresse und Schlüssel trägst du in Einstellungen → Ausgänge ein."
Wizard.TikTokKey="TikTok gibt Stream-Schlüssel nur an Konten mit LIVE-Zugang."
Wizard.NewTikTok="TikTok (neue Plattform)"
Wizard.Summary="Eingang %1 (Schlüssel %2) nimmt das Bild von Aitum Vertical und sendet es an die angehakten Plattformen, mit derselben Verzögerung wie der Rest — außer du wählst getrennt unter Einstellungen → Eingänge."
Wizard.TikTokFill="Ich habe eine TikTok-Plattform hinzugefügt. Trage Adresse und Schlüssel in Einstellungen → Ausgänge ein."
WhatsNew.Body1043="<p><b>Mehrere Eingänge.</b> Ein Eingang kann viele Plattformen beliefern — Twitch und YouTube nehmen dasselbe Bild, und OBS kodiert es einmal. Ein zweiter Eingang ist für ein anderes Bild, etwa ein vertikales für TikTok. Einstellungen → Eingänge; jede Plattform wählt ihren Eingang.</p><p><b>Assistent für vertikalen Stream.</b> Werkzeuge → LiveDelay: vertikaler Stream. Er findet Aitum Vertical, legt den Eingang an, gibt dir Adresse und Schlüssel zum Einfügen und wartet, bis das Bild wirklich ankommt.</p><p><b>Verzögerung gemeinsam oder getrennt.</b> Standardmäßig eine für alles; unter Einstellungen → Eingänge kann jeder Eingang eigene Knöpfe im Dock bekommen.</p>"
WhatsNew.Body1044="<p><b>Ein Overlay pro Bild.</b> Das Overlay steckt im Bild, also kann das Hochkant-Bild für TikTok ein anderes tragen als das von OBS. Einstellungen → Overlay → Bild: Eingang wählen und Eigenes Aussehen anhaken. Die Adresse der Browser-Quelle mit ?input= kommt in die Szene dieses Bildes, etwa die Hochkant-Szene in Aitum Vertical — sie zeigt die Verzögerung dieses Eingangs.</p><p><b>Der OBS-Schlüssel steht unter Eingänge.</b> Die OBS-Zeile hat Adresse und Schlüssel. Jeder andere Schlüssel von diesem PC landet ebenfalls im OBS-Bild; nur die weiteren Eingänge brauchen ihren eigenen.</p>"
