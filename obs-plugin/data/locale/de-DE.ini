Inputs.DelayTogether="Gemeinsam für alle Eingänge (Standard)"
Inputs.DelayPerInput="Getrennt für jeden Eingang"
Inputs.DelayModeTip="Gemeinsam: Scharf und Live wirken auf alles zugleich. Getrennt: Jeder Eingang bekommt im Dock eigene Knöpfe. Die Verzögerung gehört zum Eingang, Plattformen auf einem Eingang teilen sie also immer."
Inputs.Address="Serveradresse"
Inputs.Key="Eingangsschlüssel"
Inputs.KeyTip="Der Schlüssel, mit dem man an diesen Eingang sendet. Es ist kein Plattformschlüssel."
