<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LiveDelay preview</title>
<style>
  :root { --bg: #070707; --card: #0b0b0c; --line: #1e1e21; --text: #ebe8e3; --muted: #8a8780;
          --live: #3ddc84; --amber: #ffbf3c; --red: #ff3b2f; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 "Archivo", "Segoe UI", system-ui, sans-serif; }
  header { display: flex; align-items: center; gap: 14px; padding: 16px 22px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  h1 { font-size: 17px; font-weight: 800; margin: 0; letter-spacing: -.02em; font-stretch: 112%; }
  #state { display: inline-flex; align-items: center; gap: 8px; font: 500 11px/1 "JetBrains Mono", ui-monospace, monospace; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  #state i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  #state.live i { background: var(--live); } #state.delayed i { background: var(--red); }
  #state.arming i, #state.armed i { background: var(--amber); }
  #dests { color: var(--muted); font-size: 13px; margin-left: auto; }
  main { display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 16px; padding: 18px 22px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 0; overflow: hidden; }
  .card h2 { margin: 0; padding: 12px 16px; font-size: 13px; font-weight: 650; letter-spacing: .04em; text-transform: uppercase; display: flex; justify-content: space-between; gap: 12px; }
  .card h2 span { color: var(--muted); font-weight: 400; text-transform: none; letter-spacing: 0; }
  video { display: block; width: 100%; aspect-ratio: 16 / 9; background: #000; }
  .note { color: var(--muted); font-size: 13px; padding: 0 24px 24px; max-width: 900px; }
  .chart { grid-column: 1 / -1; }
  .chart canvas { display: block; width: 100%; height: 220px; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 18px; padding: 0 16px 14px; font-size: 13px; color: var(--muted); }
  .legend b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
  .legend i { display: inline-block; width: 10px; height: 3px; border-radius: 2px; margin-right: 6px; vertical-align: middle; }
  .off { display: grid; place-items: center; aspect-ratio: 16 / 9; color: var(--muted); background: #0b0c0f; }
</style>
<link rel="stylesheet" href="/chrome.css">
</head>
<body>
<div class="app">
  <div class="ribbon"><b>Podgląd</b><span>To, co wchodzi, i to, co idzie do widzów</span></div>
  <aside class="side">
    <a class="brand" href="/panel"><svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true"><circle cx="19.5" cy="16" r="7" fill="none" stroke="#ebe8e3" stroke-width="2"/><circle cx="12.5" cy="16" r="7" fill="#ff3b2f"/></svg><span>Live<em>Delay</em></span></a>
    <nav class="nav" id="appnav" aria-label="LiveDelay"></nav>
  </aside>
  <div class="work">
<header>
  <h1>LiveDelay</h1>
  <span id="state"><i></i><b id="stateText">…</b></span>
  <span id="dests"></span>
</header>
<main>
  <section class="card">
    <h2><b data-t="in"></b><span data-t="inSub"></span></h2>
    <div class="off" id="inOff" data-t="noSignal"></div>
    <video id="in" muted playsinline hidden></video>
  </section>
  <section class="card">
    <h2><b data-t="out"></b><span id="outSub"></span></h2>
    <div class="off" id="outOff" data-t="noSignal"></div>
    <video id="out" muted playsinline hidden></video>
  </section>
  <section class="card chart">
    <h2><b data-t="bitrate"></b><span data-t="bitrateSub"></span></h2>
    <canvas id="chart"></canvas>
    <div class="legend" id="legend"></div>
  </section>
</main>
<p class="note" data-t="note"></p>
  </div>
</div>
<script src="/nav.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.js"></script>
<script>
  const I18N = {
    en: { bitrate: 'Bitrate', bitrateSub: 'last 2 minutes, kb/s', inLine: 'From OBS', dest: { stopped: 'stopped', waiting: 'waiting', connecting: 'connecting', live: 'live', error: 'error' }, in: 'From OBS', inSub: 'what OBS sends to LiveDelay', out: 'To viewers', live: 'live, no delay',
          delayed: 'delayed {s} s', noSignal: 'Waiting for the stream from OBS…', waiting: 'WAITING FOR OBS',
          sLive: 'LIVE', sArming: 'ARMING {b}/{s} s', sArmed: 'ARMED {s} s', sDelayed: 'DELAY {s} s',
          note: 'Both players are muted and run on this computer only. The right one is exactly what LiveDelay sends to your platforms, so it trails by the delay plus a second or two of player buffer.' },
    pl: { bitrate: 'Bitrate', bitrateSub: 'ostatnie 2 minuty, kb/s', inLine: 'Z OBS', dest: { stopped: 'zatrzymana', waiting: 'czeka', connecting: 'łączy', live: 'nadaje', error: 'błąd' }, in: 'Z OBS', inSub: 'to, co OBS wysyła do LiveDelay', out: 'Do widzów', live: 'na żywo, bez opóźnienia',
          delayed: 'opóźnienie {s} s', noSignal: 'Czekam na stream z OBS…', waiting: 'CZEKAM NA OBS',
          sLive: 'NA ŻYWO', sArming: 'UZBRAJANIE {b}/{s} s', sArmed: 'UZBROJONE {s} s', sDelayed: 'OPÓŹNIENIE {s} s',
          note: 'Oba odtwarzacze są wyciszone i działają tylko na tym komputerze. Prawy pokazuje dokładnie to, co LiveDelay wysyła na platformy, więc jest z tyłu o opóźnienie plus sekundę czy dwie bufora odtwarzacza.' },
    de: { bitrate: 'Bitrate', bitrateSub: 'letzte 2 Minuten, kb/s', inLine: 'Von OBS', dest: { stopped: 'gestoppt', waiting: 'wartet', connecting: 'verbindet', live: 'sendet', error: 'Fehler' }, in: 'Von OBS', inSub: 'was OBS an LiveDelay sendet', out: 'An die Zuschauer', live: 'live, ohne Verzögerung',
          delayed: 'verzögert {s} s', noSignal: 'Warte auf den Stream von OBS…', waiting: 'WARTE AUF OBS',
          sLive: 'LIVE', sArming: 'VORBEREITUNG {b}/{s} s', sArmed: 'BEREIT {s} s', sDelayed: 'VERZÖGERT {s} s',
          note: 'Beide Player sind stumm und laufen nur auf diesem Computer. Rechts siehst du genau das, was LiveDelay an deine Plattformen sendet; es liegt um die Verzögerung plus ein, zwei Sekunden Player-Puffer zurück.' },
    ru: { bitrate: 'Битрейт', bitrateSub: 'последние 2 минуты, кбит/с', inLine: 'Из OBS', dest: { stopped: 'остановлено', waiting: 'ожидание', connecting: 'подключение', live: 'в эфире', error: 'ошибка' }, in: 'Из OBS', inSub: 'что OBS отправляет в LiveDelay', out: 'Зрителям', live: 'эфир без задержки',
          delayed: 'задержка {s} с', noSignal: 'Жду трансляцию из OBS…', waiting: 'ЖДУ OBS',
          sLive: 'ЭФИР', sArming: 'ПОДГОТОВКА {b}/{s} с', sArmed: 'ГОТОВО {s} с', sDelayed: 'ЗАДЕРЖКА {s} с',
          note: 'Оба плеера без звука и работают только на этом компьютере. Справа ровно то, что LiveDelay отправляет на платформы, поэтому он отстаёт на задержку плюс секунду-две буфера плеера.' },
  };
  const q = new URLSearchParams(location.search);
  const lang = (q.get('lang') || navigator.language || 'en').slice(0, 2);
  const L = I18N[lang] || I18N.en;
  document.documentElement.lang = I18N[lang] ? lang : 'en';
  document.querySelectorAll('[data-t]').forEach(el => el.textContent = L[el.dataset.t]);
  // {s} = configured Arm delay (not measured keyframe lag after Activate).
  const fill = (t, s) => {
    const secs = (s.arm_delay != null) ? s.arm_delay : (s.delay || 0);
    return t.replace('{s}', Math.round(secs))
            .replace('{b}', Math.floor(Math.min(s.buffer_s, secs || 0)));
  };

  const players = {};
  function play(id, on) {
    const video = document.getElementById(id), off = document.getElementById(id + 'Off');
    if (!on) {
      if (players[id]) { players[id].destroy(); delete players[id]; }
      video.hidden = true; off.hidden = false;
      return;
    }
    if (players[id] || !window.mpegts || !mpegts.isSupported()) return;
    const p = mpegts.createPlayer({ type: 'flv', isLive: true, url: '/live-preview/' + id + '.flv' },
      { enableStashBuffer: false, liveBufferLatencyChasing: true, liveBufferLatencyMaxLatency: 3 });
    p.attachMediaElement(video);
    p.load();
    p.play().catch(() => {});
    p.on(mpegts.Events.ERROR, () => { play(id, false); setTimeout(() => last && play(id, last.input), 2000); });
    players[id] = p;
    video.hidden = false; off.hidden = true;
  }

  let last = null;
  const es = new EventSource('/events');
  es.onmessage = (e) => {
    const s = JSON.parse(e.data);
    const state = document.getElementById('state'), text = document.getElementById('stateText');
    let kind = 'live', label = L.sLive;
    if (!s.input && s.mode !== 'delayed') { kind = ''; label = L.waiting; }
    else if (s.mode === 'delayed') { kind = 'delayed'; label = fill(L.sDelayed, s); }
    else if (s.arm_delay !== null) { kind = s.armed ? 'armed' : 'arming'; label = fill(s.armed ? L.sArmed : L.sArming, s); }
    state.className = kind; text.textContent = label;
    document.getElementById('outSub').textContent = s.mode === 'delayed' ? fill(L.delayed, s) : L.live;
    document.getElementById('dests').textContent = s.dests.map(d => d.name + ': ' + (L.dest[d.state] || d.state) + (d.kbps ? ' ' + d.kbps + ' kb/s' : '')).join('  ·  ');
    if (!last || last.input !== s.input) { play('in', s.input); play('out', s.input); }
    last = s;
    record(s);
  };

  // Bitrate history: OBS input plus one line per platform, one point a second.
  const HISTORY = 120, COLORS = ['#3ddc84', '#5ac8fa', '#ff9f0a', '#bf5af2', '#ff5a4f', '#ffd60a'];
  const series = new Map();
  let lastPoint = 0;
  function record(s) {
    const now = Date.now();
    if (now - lastPoint < 900) return;
    lastPoint = now;
    const values = [[L.inLine, s.input ? s.in_kbps : 0]];
    for (const d of s.dests) values.push([d.name, d.state === 'live' ? d.kbps : 0]);
    for (const [name, v] of values) {
      if (!series.has(name)) series.set(name, []);
      const arr = series.get(name);
      arr.push(v);
      if (arr.length > HISTORY) arr.shift();
    }
    draw();
  }
  function draw() {
    const c = document.getElementById('chart'), ctx = c.getContext('2d'), dpr = devicePixelRatio || 1;
    const w = c.clientWidth, h = c.clientHeight;
    c.width = w * dpr; c.height = h * dpr; ctx.scale(dpr, dpr);
    let max = 1000;
    for (const arr of series.values()) for (const v of arr) max = Math.max(max, v);
    const step = max > 20000 ? 5000 : max > 8000 ? 2000 : 1000;
    max = Math.ceil(max * 1.1 / step) * step;
    const pad = { l: 56, r: 12, t: 10, b: 22 }, pw = w - pad.l - pad.r, ph = h - pad.t - pad.b;
    ctx.font = '12px Segoe UI, system-ui, sans-serif'; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    for (let v = 0; v <= max; v += step) {
      const y = pad.t + ph - v / max * ph;
      ctx.strokeStyle = '#262a33'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(w - pad.r, y); ctx.stroke();
      ctx.fillStyle = '#8b90a0'; ctx.fillText(v >= 1000 ? (v / 1000) + 'k' : v, pad.l - 8, y);
    }
    const legend = [];
    let i = 0;
    for (const [name, arr] of series) {
      const color = COLORS[i++ % COLORS.length];
      ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.lineJoin = 'round'; ctx.beginPath();
      arr.forEach((v, k) => {
        const x = pad.l + (k + HISTORY - arr.length) / (HISTORY - 1) * pw, y = pad.t + ph - v / max * ph;
        k ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
      });
      ctx.stroke();
      const cur = arr[arr.length - 1] || 0;
      legend.push('<span><i style="background:' + color + '"></i>' + name.replace(/</g, '&lt;') + ' <b>' + Math.round(cur) + ' kb/s</b></span>');
    }
    document.getElementById('legend').innerHTML = legend.join('');
  }
  addEventListener('resize', draw);
</script>
</body>
</html>
