WhatsNew.Title="Co nowego w LiveDelay %1"
WhatsNew.From="Zaktualizowano z %1."
WhatsNew.FromEarlier="Zaktualizowano z wcześniejszej wersji LiveDelay."
WhatsNew.Ok="Rozumiem"
WhatsNew.Body1040="<p><b>Nowe ustawienia mają nazwy.</b> Aktualizacja zapisała tłumaczenia obok OBS, a nie w folderze wtyczki, więc kodek bufora i reszta pokazywały się jako surowe klucze. Znowu są po polsku.</p>"
WhatsNew.Body1039="<p><b>Start nadawania już nie pada w pół kroku.</b> LiveDelay poprawia klucz na serwisie, który OBS już ma, zamiast podmieniać ten serwis w trakcie startu. Stąd brało się puste okno „nie udało się uruchomić wyjścia”.</p><p><b>Twitch to nie Kick.</b> Automatyczny ingest Twitcha nie jest już brany za Kicka, więc NVENC nie przeskakuje z HEVC na H.264, dopóki Kick nie jest włączony i stream naprawdę tam idzie.</p><p><b>Kodek bufora do wyboru.</b> W ustawieniach i w panelu: jak w OBS, H.264, HEVC albo AV1. Zostaje na tej samej karcie. Jeden PC używa jednego enkodera OBS do bufora, więc gra na tym komputerze nie płaci za drugą sesję NVENC.</p>"
WhatsNew.Body1038="<p><b>Ścieżka VOD zostaje przy Twitchu.</b> Przy Kicku, YouTube i własnym RTMP jest checkbox Pokaż osobną ścieżkę VOD. LiveDelay pyta, czy kontynuować, bo ta platforma jej nie obsługuje. Po tak pojawia się wybór i drugi dźwięk leci mimo to.</p><p><b>Informacja o osobnym kodowaniu tylko gdy ustawienia się różnią.</b> Jak platformy mają ten sam enkoder, bitrate i rozmiar, baner znika.</p>"
WhatsNew.Body1037="<p><b>Ścieżka na żywo i ścieżka VOD zostają zawsze.</b> Pole nie znika przy Kicku, YouTube ani własnym RTMP. Tooltip mówi, że drugi dźwięk do nagrania działa na Twitchu, a inne platformy tę ścieżkę ignorują. Na Twitcha nadal idzie osobny AAC.</p>"
WhatsNew.Body1036="<p><b>Trzy platformy bez śmieci w logu.</b> Ostrzeżenie o osobnym kodowaniu nie zapycha już logu OBS. Kick nie pokazuje instrukcji ścieżki VOD od Twitcha. Dwie platformy nie dostaną tego samego klucza. Adres Kicka zostaje pusty: wklejasz go ze swojego panelu.</p>"
WhatsNew.Body1035="<p><b>Bitrate osobno dla każdej platformy.</b> Zalecane ustawia Twitch bez Partnera na 6000 kb/s, Kick na 8000 kb/s, a pozostałe platformy na ich własny limit. Wpisanie liczby przełącza tylko tę platformę na Ręcznie.</p>"
WhatsNew.Body1032="<p><b>Dok wygląda jak reszta LiveDelay.</b> Bierze kolory ze strony i z aplikacji, a pełny jest dokładnie jeden przycisk: ta akcja, na którą czeka stan. Reszta zostaje obrysowana. W ustawieniach jest Wygląd doku: jak w OBS, ciemny LiveDelay albo kontrastowy. To, co widzą widzowie, dalej ustawiasz w edytorze nakładki.</p><p><b>Panel w przeglądarce prosto z doku.</b> Nowy przycisk otwiera wszystkie ustawienia w przeglądarce — tę samą stronę, co aplikacja — mimo że silnik siedzi w OBS.</p><p><b>Zmiany zrobione gdzie indziej widać od razu.</b> Dok pilnuje livedelay.ini, więc zapis z panelu albo z aplikacji dochodzi bez restartu OBS. Zmiana listy platform podnosi silnik, ale tylko gdy nic nie leci.</p><p><b>Platforma bez autostartu naprawdę czeka.</b> Rozpoczęcie transmisji w OBS nie odpala już platform, które mają odznaczone &quot;Startuj automatycznie razem ze streamem z OBS&quot;. Czekają na Start w panelu, tak jak mówi ten checkbox.</p><p><b>Kick prosi o twój własny adres.</b> Wpisany wcześniej domyślny adres był ingestem jednego konkretnego kanału — stąd łączenie, chwila &quot;nadaje&quot; i błąd w kółko. Wklej adres RTMP ze swojego panelu Kicka. Punkt końcowy SRT przez LiveDelay nie przejdzie i teraz jest to powiedziane wprost.</p>"
WhatsNew.Body1031="<p><b>Twitch Enhanced Broadcasting (beta).</b> Przy Twitchu checkbox pyta Twitcha o sesję GoLive i wysyła drabinkę jakości, którą Twitch zwróci. Uzbrój, Włącz opóźnienie i Na żywo ruszają wszystkie jakości razem. Jak Twitch nie odda sesji, zostaje jedna ścieżka wideo na zwykłym ingeście. Kick i YouTube zostają na jednej. Własne Enhanced Broadcasting w OBS zostaje wyłączone, bo własny serwer nie ma adresu GoLive.</p><p><b>Tekst w ciemnym motywie zostaje czytelny.</b> Podpowiedzi, stan na doku i okna pomocy biorą kolor z motywu OBS, więc nie wychodzą czarne na czarnym.</p>"
WhatsNew.Body1030="<p><b>LiveDelay nie melduje się już na stronie.</b> Wtyczka nie wysyła sygnału, że jest włączona. Licznik otwartych kopii zniknął. Poza sprawdzaniem aktualizacji i brakujących tłumaczeń nic nie wychodzi tylko po to, żeby cię policzyć.</p><p><b>Ścieżka audio osobno dla każdej platformy.</b> Przy platformie jest pole Ścieżka na żywo. Wybierasz ścieżkę OBS od 1 do 6 — to słyszą widzowie tej platformy. Jak w OBS zostawia ścieżkę z Ustawienia, Wyjście.</p><p><b>Ścieżka VOD na Twitchu idzie jako drugi dźwięk.</b> Wybierasz inną ścieżkę niż na żywo. LiveDelay wysyła ją drugim AAC. Na żywo zostaje pierwsza, a Twitch może zapisać drugą w VOD. Po Uzbrój, Włącz opóźnienie i Na żywo nagłówek tej ścieżki leci ponownie, więc dźwięk VOD nie ginie po skoku delayu.</p><p><b>Które źródło na którą ścieżkę.</b> Zakładka Audio pokazuje mikrofon, pulpit, muzykę i resztę. Przy każdym zaznaczasz ścieżki 1–6. Żeby zdjąć muzykę z VOD, zostaw ją na ścieżce na żywo i odznacz na ścieżce VOD. YouTube i Kick ścieżki VOD nie używają. Przypisanie źródeł zostaje w kolekcji scen OBS.</p>"
