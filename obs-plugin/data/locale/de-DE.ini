Wizard.SourceBody="Das vertikale Bild erzeugt ein eigenes Programm oder Plugin — LiveDelay setzt es nicht zusammen. Meist ist es Aitum Vertical im selben OBS: Es hat eine eigene Leinwand und streamt sie selbst."
