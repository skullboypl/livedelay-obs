Help.Title="LiveDelay – как подключить"
Help.RouteNow="Настроить OBS сейчас"
Help.Close="Закрыть"
Help.Body="<h3>Подключите LiveDelay за 4 шага</h3><ol><li><b>Направьте OBS в LiveDelay.</b> Нажмите <i>Настроить OBS сейчас</i> ниже. Текущий сервер и ключ трансляции перейдут в LiveDelay, а OBS будет транслировать на <code>rtmp://127.0.0.1:1935/live</code>. Вручную: Настройки → Трансляция → Сервис <i>Настраиваемый</i>, этот сервер, любой ключ.</li><li><b>Проверьте платформы.</b> В <i>Настройках</i> добавьте другие (Twitch, YouTube, Kick…) и выберите, какие запускаются вместе с трансляцией.</li><li><b>Запустите трансляцию в OBS</b> как обычно. Панель сменится с <i>Жду трансляцию из OBS</i> на <i>ЭФИР</i>.</li><li><b>Пользуйтесь задержкой.</b> Задайте секунды, нажмите <i>Подготовить</i>, дождитесь <i>готово</i>, затем <i>Включить задержку</i>. <i>В эфир</i> возвращает без задержки.</li></ol><p><b>Дополнительно.</b> Горячие клавиши: Настройки → Горячие клавиши → «LiveDelay: …» (numpad, Stream Deck). Оверлей для зрителей: источник «Браузер» с адресом <code>%1</code>. Что отправляется: кнопка <i>Просмотр</i>.</p>"
Settings.RoutedNoTarget="В OBS не был задан сервер или ключ, поэтому переносить было нечего. Теперь OBS транслирует в LiveDelay. Добавьте платформу в список: выберите шаблон, вставьте ключ трансляции и нажмите «Сохранить»."
