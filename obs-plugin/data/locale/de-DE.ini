Inputs.OverlayLook="Aussehen"
Inputs.OverlayLookTip="Overlay-Editor nur für diesen Eingang. Ohne eigenes Aussehen zeigt er das Haupt-Aussehen."
Inputs.OverlayAbout="Das Overlay steckt im Bild, also hat dieses Bild sein eigenes: füge eine Browser-Quelle mit dieser Adresse zu seiner Szene hinzu (etwa der Hochkant-Szene in Aitum Vertical). Es zeigt die Verzögerung dieses Eingangs."
Inputs.BufferNote="Das Speicherlimit des Puffers wird gleichmäßig auf die Eingänge verteilt. Bei zwei Eingängen hat jeder die Hälfte — reichen die Sekunden nicht, hebe das Limit im Reiter Allgemein an."
