Limits.TwitchCapTip="Klassisches Twitch spielt höchstens 1080p — darüber erscheint der Kanal als live und Zuschauer bekommen Fehler #1000. In „Ein PC“ und „Live aus OBS erzwingen“ sendet das Plugin das OBS-Bild deshalb kleiner. Nimmt dein Konto mehr an, stelle die Größe von Hand ein: Ausgänge → Twitch → Kodiermodus „Manuell“."
