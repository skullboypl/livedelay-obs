Wizard.SignalChecks="Prüfen: Adresse und Schlüssel ohne Leerzeichen am Ende eingefügt · der Stream im Vertical-Dock wirklich gestartet, nicht nur eingerichtet · in Aitum kein alter Server mit Plattformschlüssel übrig."
