Encode.VodShowAsk="Według LiveDelay podana platforma nie obsługuje osobnej ścieżki VOD. Czy chcesz kontynuować?"
Encode.VodTrackHelp="<b>Jak zdjąć muzykę z VOD na Twitchu</b><br>1. Zakładka <b>Audio</b>: zostaw muzykę tylko na ścieżce na żywo, zdejmij ją ze ścieżki VOD.<br>2. Przy Twitchu wybierz <b>ścieżkę na żywo</b> i inną <b>ścieżkę VOD</b>.<br>3. Zapisz. LiveDelay wyśle ją jako drugi AAC. Widzowie słyszą wszystko, VOD nie.<br>Tylko Twitch. YouTube i Kick ignorują ścieżkę VOD."
