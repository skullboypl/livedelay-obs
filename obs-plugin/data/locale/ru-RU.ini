Inputs.ObsSharedNote="Отмеченные платформы получают один общий поток: OBS кодирует и отправляет картинку один раз, а не по разу на каждую. Настройки кодирования задаёт первая из них. Неотмеченные кодируют отдельно. У каждого кодирования свой ключ входа — плагин задаёт их сам, вставлять их никуда не нужно."
Inputs.ExternalAbout="Вход для другой программы, например Aitum Vertical. Вставьте в неё адрес и ключ ниже — эта программа сама отправляет картинку в LiveDelay."
