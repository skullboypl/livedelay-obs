Help.Title="LiveDelay – how to connect"
Help.RouteNow="Route OBS now"
Help.Close="Close"
Help.Body="<h3>Connect LiveDelay in 4 steps</h3><ol><li><b>Point OBS at LiveDelay.</b> Click <i>Route OBS now</i> below. Your current server and stream key move into LiveDelay, and OBS streams to <code>rtmp://127.0.0.1:1935/live</code>. By hand: Settings → Stream → Service <i>Custom</i>, that server, any key.</li><li><b>Check the platforms.</b> In <i>Settings</i> add more (Twitch, YouTube, Kick…) and choose which start automatically with the stream.</li><li><b>Start streaming in OBS</b> as usual. The panel changes from <i>Waiting for OBS stream</i> to <i>LIVE</i>.</li><li><b>Use the delay.</b> Set the seconds, press <i>Arm</i>, wait for <i>armed</i>, then <i>Activate</i>. <i>Cut</i> takes you back to live.</li></ol><p><b>Extras.</b> Hotkeys: Settings → Hotkeys → “LiveDelay: …” (numpad, Stream Deck). Overlay for viewers: a Browser source with <code>%1</code>. What is being sent: the <i>Preview</i> button.</p>"
Settings.RoutedNoTarget="OBS had no stream server or key set, so there was nothing to move. OBS now streams to LiveDelay. Add your platform in the list: pick a template and paste your stream key, then Save."
