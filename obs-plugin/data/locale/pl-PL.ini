WhatsNew.Body1043="<p><b>Wiele wejść.</b> Jedno wejście może karmić wiele platform — Twitch i YouTube biorą ten sam obraz, a OBS koduje go raz. Drugie wejście jest na inny obraz, np. pionowy na TikToka. Ustawienia → Wejścia; przy każdej platformie wybierasz, z którego wejścia korzysta.</p><p><b>Kreator pionowego streamu.</b> Narzędzia → LiveDelay: pionowy stream. Wykrywa Aitum Vertical, robi wejście, daje adres i klucz do wklejenia i czeka, aż obraz naprawdę dojdzie.</p><p><b>Opóźnienie wspólne albo osobne.</b> Domyślnie jedno dla wszystkiego; w Ustawieniach → Wejścia możesz dać każdemu wejściu własne przyciski w doku.</p>"
WhatsNew.Body1044="<p><b>Osobny overlay na każdy obraz.</b> Overlay jest wtopiony w obraz, więc pionowy obraz dla TikToka może mieć inny niż ten z OBS. Ustawienia → Overlay → Obraz: wybierz wejście i zaznacz „Własny wygląd”. Adres źródła Przeglądarka z ?input= dodaj do sceny tego obrazu, np. pionowej w Aitum Vertical — pokazuje opóźnienie tego wejścia.</p><p><b>Klucz OBS widać w Wejściach.</b> Wiersz OBS ma adres i klucz. Każdy inny klucz z tego komputera też trafi na obraz OBS; własnego klucza pilnują tylko dodatkowe wejścia.</p>"
