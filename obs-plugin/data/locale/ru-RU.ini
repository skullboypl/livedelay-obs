WhatsNew.Body1043="<p><b>Несколько входов.</b> Один вход может кормить много платформ — Twitch и YouTube берут одну картинку, и OBS кодирует её один раз. Второй вход — для другой картинки, например вертикальной для TikTok. Настройки → Входы; у каждой платформы выбирается её вход.</p><p><b>Мастер вертикального стрима.</b> Сервис → LiveDelay: вертикальный стрим. Находит Aitum Vertical, создаёт вход, даёт адрес и ключ для вставки и ждёт, пока картинка действительно придёт.</p><p><b>Задержка общая или отдельная.</b> По умолчанию одна на всё; в Настройки → Входы каждому входу можно дать свои кнопки в доке.</p>"
WhatsNew.Body1044="<p><b>Свой оверлей на каждую картинку.</b> Оверлей встроен в картинку, поэтому у вертикальной картинки для TikTok может быть другой, чем у OBS. Настройки → Оверлей → Картинка: выберите вход и отметьте «Свой вид». Адрес источника «Браузер» с ?input= добавьте в сцену этой картинки, например вертикальную в Aitum Vertical — он показывает задержку этого входа.</p><p><b>Ключ OBS виден во Входах.</b> В строке OBS есть адрес и ключ. Любой другой ключ с этого компьютера тоже попадёт на картинку OBS; свой ключ нужен только остальным входам.</p>"
WhatsNew.Body1045="<p><b>Занятый порт больше не останавливает LiveDelay.</b> Если порт 1935 или 7799 занят другой программой (RTMP-сервер, вторая копия OBS, диапазон, зарезервированный Windows), LiveDelay берёт следующий свободный, сохраняет его в настройках и переключает на него сервер трансляции OBS и панель. Раньше OBS показывал ошибку 10048 и задержка не работала.</p>"
WhatsNew.Body1046="<p><b>Kick снова работает рядом с Twitch.</b> Платформы на одном входе делят один поток, поэтому Kick получал то, что настроено для Twitch: вторую аудиодорожку (VOD) и дополнительные качества Enhanced Broadcasting. Он подключался, брал первый ключевой кадр и обрывался по кругу. Теперь дополнительные дорожки идут только на Twitch, а поток, общий с Kick, остаётся в H.264.</p>"
WhatsNew.Body1047="<p><b>Вторая картинка (например, из Aitum Vertical) доходит до платформы с любым ключом.</b> Если в Aitum был указан ключ платформы (например, ld1 у TikTok) вместо ключа входа, картинка попадала на вход OBS: второй вход показывал «нет сигнала», а TikTok ждал. Теперь ключ платформы ведёт к входу, который её питает.</p><p><b>Ключ, набранный вручную, тоже работает.</b> «ld1» начинается с маленькой L, которая во многих шрифтах похожа на заглавную I, поэтому легко набрать «Id1». Теперь LiveDelay считает I и l, а также O и 0 одной буквой, не смотрит на регистр и пробелы и принимает даже целый вставленный адрес с ключом в конце.</p>"
WhatsNew.Body1048="<p><b>Просмотр для каждой картинки отдельно.</b> При нескольких входах вверху страницы просмотра есть панель: OBS, Pionowe и т. д., у каждого точка сигнала и кбит/с. Выбранный вход показывает свою картинку – что приходит и что видят зрители после его собственной задержки, – свои платформы и свою линию битрейта. Вертикальная картинка получает вертикальную рамку. В доке у каждого входа есть кнопка ▶, открывающая его просмотр.</p><p><b>Twitch снова получает отдельный звук для VOD, когда делит вход с Kick.</b> С 1.0.46 Kick (или YouTube) на том же входе убирал из общего кодирования дорожку VOD, и в VOD Twitch был обычный живой микс. Движок и так удаляет эту дорожку перед отправкой на Kick, поэтому теперь она остаётся. Это работает и когда Kick стоит в списке выше Twitch.</p>"
