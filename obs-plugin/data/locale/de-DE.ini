WhatsNew.Title="Neu in LiveDelay %1"
WhatsNew.From="Aktualisiert von %1."
WhatsNew.FromEarlier="Aktualisiert von einer älteren LiveDelay-Version."
WhatsNew.Ok="Verstanden"
WhatsNew.Body1037="<p><b>Live-Spur und VOD-Spur bleiben sichtbar.</b> Das Feld verschwindet nicht mehr bei Kick, YouTube oder einem eigenen RTMP-Server. Der Tooltip sagt, dass der zweite Ton für die Aufnahme auf Twitch funktioniert und andere Plattformen diese Spur ignorieren. Twitch bekommt weiterhin ein eigenes AAC.</p>"
WhatsNew.Body1040="<p><b>Die neuen Einstellungen haben Namen.</b> Ein Update hatte die Übersetzungen neben OBS statt im Plugin-Ordner gespeichert, deshalb erschienen Puffer-Codec und der Rest als nackte Schlüssel. Sie heißen wieder richtig.</p>"
WhatsNew.Body1039="<p><b>Start Streaming bricht nicht mehr mittendrin ab.</b> LiveDelay ändert den Key am Dienst, den OBS schon hat, statt den Dienst während des Starts auszutauschen. Daher kam der leere Dialog „Ausgabe konnte nicht gestartet werden“.</p><p><b>Twitch ist nicht Kick.</b> Der automatische Twitch-Ingest gilt nicht mehr als Kick, also wechselt NVENC nicht von HEVC auf H.264, solange Kick nicht eingeschaltet ist und der Stream wirklich dorthin geht.</p><p><b>Codec des Puffers wählbar.</b> In den Einstellungen und im Web-Panel: wie OBS, H.264, HEVC oder AV1. Es bleibt dieselbe Grafikkarte. Ein PC nutzt einen OBS-Encoder für den Puffer, damit ein Spiel auf demselben Rechner keine zweite NVENC-Session bezahlt.</p>"
WhatsNew.Body1038="<p><b>Die VOD-Spur bleibt bei Twitch.</b> Kick, YouTube und ein eigener RTMP-Server bekommen ein Häkchen, Separate VOD-Spur anzeigen. LiveDelay fragt nach, weil diese Plattform sie voraussichtlich nicht unterstützt. Mit Ja erscheint die Auswahl und der zweite Ton geht trotzdem raus.</p><p><b>Der Hinweis zum getrennten Encoder nur bei unterschiedlichen Einstellungen.</b> Plattformen mit demselben Encoder, derselben Bitrate und derselben Größe zeigen die Karte nicht mehr.</p>"
WhatsNew.Body1036="<p><b>Drei Plattformen, und ein ruhiges Log.</b> Der Hinweis zum getrennten Encoder flutet das OBS-Log nicht mehr. Kick zeigt nicht mehr die Twitch-VOD-Anleitung. Zwei Plattformen teilen sich keinen Schlüssel mehr. Die Kick-Adresse bleibt leer: einfügen aus dem eigenen Dashboard.</p>"
WhatsNew.Body1035="<p><b>Bitrate je Plattform.</b> Empfohlen setzt Twitch ohne Partner auf 6000 kb/s, Kick auf 8000 kb/s und die übrigen Plattformen auf ihr eigenes Limit. Eine eigene Zahl schaltet nur diese Plattform auf Manuell.</p>"
WhatsNew.Body1032="<p><b>Das Dock sieht aus wie der Rest von LiveDelay.</b> Es übernimmt die Farben der Seite und der App und füllt genau eine Schaltfläche: die Aktion, auf die der aktuelle Zustand wartet. Der Rest bleibt umrandet. In den Einstellungen gibt es Aussehen des Docks: wie OBS, LiveDelay dunkel oder hoher Kontrast. Was die Zuschauer sehen, stellst du weiterhin im Overlay-Editor ein.</p><p><b>Web-Panel direkt aus dem Dock.</b> Die neue Schaltfläche öffnet alle Einstellungen im Browser — dieselbe Seite wie in der eigenständigen App — obwohl die Engine in OBS läuft.</p><p><b>Anderswo geänderte Einstellungen erscheinen sofort.</b> Das Dock beobachtet livedelay.ini, also kommt ein Speichern aus dem Web-Panel oder der App ohne OBS-Neustart an. Eine geänderte Plattformliste startet die Engine neu, aber nur solange nichts gesendet wird.</p><p><b>Eine Plattform ohne Autostart wartet wirklich.</b> Das Starten der Übertragung in OBS startet keine Plattformen mehr, bei denen &quot;Automatisch mit dem OBS-Stream starten&quot; aus ist. Sie warten auf Start im Panel, genau wie das Häkchen sagt.</p><p><b>Kick fragt nach deiner eigenen Adresse.</b> Die mitgelieferte Vorgabe war der Ingest-Host eines einzelnen Kanals — daher das Verbinden, kurz &quot;sendet&quot; und dann immer wieder ein Fehler. Füge die RTMP-Adresse aus deinem Kick-Dashboard ein. Ein SRT-Endpunkt geht nicht durch LiveDelay, und das steht jetzt auch da.</p>"
WhatsNew.Body1031="<p><b>Twitch Enhanced Broadcasting (Beta).</b> Beim Twitch-Ziel fragt das Häkchen Twitch nach einer GoLive-Sitzung und sendet die Qualitätsleiter, die Twitch zurückgibt. Arm, Activate und Cut bewegen jede Qualität zusammen. Antwortet Twitch nicht, bleibt eine Videospur auf dem normalen Ingest. Kick und YouTube bleiben bei einer Spur. Das eigene Enhanced Broadcasting in OBS bleibt aus, weil ein eigener Server keine GoLive-Adresse hat.</p><p><b>Text im dunklen Design bleibt lesbar.</b> Hinweise, der Dock-Status und die Hilfefenster nehmen ihre Farbe aus dem OBS-Design, also nicht mehr schwarz auf schwarz.</p>"
WhatsNew.Body1030="<p><b>LiveDelay meldet sich nicht mehr auf der Website.</b> Das Plugin sendet kein Signal, dass es offen ist. Der Zähler offener Kopien ist weg. Außer der Update-Prüfung und fehlenden Übersetzungen geht nichts nur zum Zählen raus.</p><p><b>Jede Plattform hat eine eigene Audiospur.</b> Bei der Plattform wählt Live-Audiospur die OBS-Spur 1 bis 6. Das hören die Zuschauer dieser Plattform. Wie in OBS behält die Spur aus Einstellungen, Ausgabe.</p><p><b>Die Twitch-VOD-Spur ist ein zweiter Ton.</b> Wähle eine andere Spur als die Live-Spur. LiveDelay sendet sie als zweites AAC. Zuschauer behalten die erste, Twitch kann die zweite im VOD speichern. Nach Arm, Activate und Cut geht der Header dieser Spur erneut raus, damit der VOD-Ton den Delay-Sprung übersteht.</p><p><b>Welche Quelle auf welche Spur.</b> Der Tab Audio zeigt Mikrofon, Desktop, Musik und die übrigen Quellen. Jede kann auf den Spuren 1–6 liegen. Musik bleibt auf der Live-Spur und wird auf der VOD-Spur abgewählt. YouTube und Kick nutzen die VOD-Spur nicht. Die Zuordnung bleibt in der OBS-Szenensammlung.</p>"
