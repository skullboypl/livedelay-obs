Limits.TwitchCapTip="Классический Twitch воспроизводит максимум 1080p — выше канал показывается как вещающий, а зрители получают ошибку #1000. В режимах «Один ПК» и «Эфир из OBS принудительно» плагин поэтому уменьшает картинку OBS. Если ваш аккаунт принимает больше, задайте размер вручную: Выходы → Twitch → режим кодирования «Вручную»."
