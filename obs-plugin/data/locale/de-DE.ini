Inputs.ObsSharedNote="Angehakte Plattformen bekommen einen gemeinsamen Stream: OBS kodiert und sendet das Bild einmal statt einmal pro Plattform. Die erste von ihnen bestimmt die Encoder-Einstellungen. Nicht angehakte kodieren getrennt. Jede Kodierung hat ihren eigenen Eingangsschlüssel — das Plugin setzt sie selbst, du fügst sie nirgends ein."
