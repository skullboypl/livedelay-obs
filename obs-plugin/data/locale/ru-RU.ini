Encode.VodAudioTip="Второй AAC из OBS Advanced Output → Twitch VOD Track. В эфире полный микс, на VOD другая дорожка."
Encode.VodAudioHelp="<b>Как убрать музыку из VOD на Twitch</b><br>1. OBS → Настройки → Вывод → режим <b>Расширенный</b>.<br>2. Вкладка Трансляция: включите <b>Twitch VOD Track</b> и выберите дорожку, отличную от эфира (обычно 2).<br>3. Правка → Расширенные свойства звука: выключите музыку только на дорожке VOD. На эфирной оставьте полный микс.<br>4. Отметьте этот флажок у площадки Twitch и сохраните. LiveDelay отправит её вторым AAC. Зрители слышат всё, VOD — без выключенных источников.<br>Только Twitch. YouTube и Kick этот флажок не используют."
