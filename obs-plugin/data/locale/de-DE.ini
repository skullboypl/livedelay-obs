Encode.VodAudioHelp="<b>Musik vom Twitch-VOD trennen</b><br>1. OBS → Einstellungen → Ausgabe → Ausgabemodus: <b>Erweitert</b>.<br>2. Tab Stream: <b>Twitch-VOD-Track</b> einschalten und eine Spur wählen, die nicht die Live-Spur ist (meist 2).<br>3. Bearbeiten → Erweiterte Audioeigenschaften: Musik nur auf der VOD-Spur stummschalten. Live-Spur bleibt der volle Mix.<br>4. Dieses Kästchen bei der Twitch-Plattform aktivieren und speichern. LiveDelay sendet die Spur als zweites AAC. Zuschauer hören alles, das VOD nicht die stummen Quellen.<br>Nur Twitch. YouTube und Kick ignorieren das Kästchen."
