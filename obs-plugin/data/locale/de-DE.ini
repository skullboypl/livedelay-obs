Inputs.About="Eingänge sind die Bilder, die bei LiveDelay ankommen: immer das aus OBS und — wenn du willst — weitere aus anderen Programmen, etwa ein vertikales aus Aitum Vertical. Im Reiter Ausgänge wählt jede Plattform, von welchem Eingang sie ihr Bild nimmt."
