Inputs.PlatformInput="Eingang"
Inputs.PlatformInputTip="Von welchem Eingang diese Plattform ihr Bild nimmt. OBS — eigene Kodierung: ein eigener Encoder mit den Einstellungen unten. OBS — gemeinsame Kodierung: ein Encoder für alle Plattformen, die das gewählt haben. Die übrigen Einträge sind die Eingänge aus dem Reiter Eingänge."
