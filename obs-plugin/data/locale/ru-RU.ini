WhatsNew.Body1035="<p><b>Битрейт отдельно для каждой площадки.</b> Рекомендуемые ставят Twitch без Partner на 6000 кбит/с, Kick на 8000 кбит/с, а остальные площадки на их собственный предел. Своё число переключает только эту площадку на Вручную.</p>"
WhatsNew.Body1032="<p><b>Док выглядит как остальной LiveDelay.</b> Он берёт цвета сайта и приложения и заливает ровно одну кнопку — то действие, которого ждёт текущее состояние. Остальные остаются в рамке. В настройках появился Вид дока: как в OBS, тёмный LiveDelay или контрастный. То, что видят зрители, по-прежнему настраивается в редакторе оверлея.</p><p><b>Веб-панель прямо из дока.</b> Новая кнопка открывает все настройки в браузере — ту же страницу, что и отдельное приложение, — хотя движок работает внутри OBS.</p><p><b>Изменения, сделанные в другом месте, видны сразу.</b> Док следит за livedelay.ini, поэтому сохранение из веб-панели или приложения доходит без перезапуска OBS. Изменение списка площадок перезапускает движок, но только когда ничего не идёт.</p><p><b>Площадка без автостарта действительно ждёт.</b> Запуск трансляции в OBS больше не запускает площадки, у которых снят флажок &quot;Запускать автоматически вместе с трансляцией OBS&quot;. Они ждут Старт в панели, как и написано у флажка.</p><p><b>Kick просит ваш собственный адрес.</b> Прежний адрес по умолчанию был ingest-хостом одного конкретного канала — отсюда подключение, короткое &quot;вещает&quot; и ошибка по кругу. Вставьте адрес RTMP из своей панели Kick. Точка SRT через LiveDelay не пройдёт, и теперь об этом сказано прямо.</p>"
WhatsNew.Body1031="<p><b>Twitch Enhanced Broadcasting (бета).</b> У цели Twitch галочка спрашивает у Twitch сессию GoLive и шлёт лестницу качеств, которую Twitch вернул. Arm, Activate и Cut двигают все качества вместе. Если Twitch не вернёт сессию, остаётся одна видеодорожка на обычном ingest. Kick и YouTube остаются на одной. Собственный Enhanced Broadcasting в OBS остаётся выключенным: у своего сервера нет адреса GoLive.</p><p><b>Текст в тёмной теме остаётся читаемым.</b> Подсказки, статус на доке и окна справки берут цвет из темы OBS и больше не выходят чёрными на чёрном.</p>"
WhatsNew.Body1030="<p><b>LiveDelay больше не отмечается на сайте.</b> Плагин не шлёт сигнал, что он открыт. Счётчик запущенных копий убран. Кроме проверки обновлений и недостающих переводов ничего не уходит только ради подсчёта.</p><p><b>У каждой платформы своя аудиодорожка.</b> В настройках платформы поле Дорожка эфира выбирает дорожку OBS от 1 до 6. Её слышат зрители этой платформы. Как в OBS оставляет дорожку из Настройки, Вывод.</p><p><b>VOD-дорожка Twitch — это второй звук.</b> Выберите дорожку, отличную от эфира. LiveDelay отправит её вторым AAC. В эфире остаётся первая, а Twitch может записать вторую в VOD. После Arm, Activate и Cut заголовок этой дорожки уходит снова, поэтому звук VOD не пропадает после скачка задержки.</p><p><b>Какой источник на какую дорожку.</b> Вкладка Аудио показывает микрофон, рабочий стол, музыку и остальные источники. У каждого отмечаются дорожки 1–6. Чтобы убрать музыку из VOD, оставьте её на дорожке эфира и снимите с VOD-дорожки. YouTube и Kick VOD-дорожку не используют. Назначение остаётся в коллекции сцен OBS.</p>"
