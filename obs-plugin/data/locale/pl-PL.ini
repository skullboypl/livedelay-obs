Limits.TwitchCapTip="Klasyczny Twitch odtwarza najwyżej 1080p — powyżej kanał pokazuje się jako nadający, a widzowie dostają błąd #1000. W trybie „Jeden PC” i „Wymuś live z OBS” wtyczka zmniejsza więc obraz z OBS. Jeśli twoje konto przyjmuje więcej, ustaw rozmiar ręcznie: Wyjścia → Twitch → tryb kodowania „Ręcznie”."
