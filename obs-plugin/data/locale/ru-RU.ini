Encode.VodTrackHelp="<b>Как убрать музыку из VOD на Twitch</b><br>1. Вкладка <b>Аудио</b>: оставьте музыку только на дорожке эфира и снимите её с VOD-дорожки.<br>2. У Twitch выберите <b>дорожку эфира</b> и другую <b>VOD-дорожку</b>.<br>3. Сохраните. LiveDelay отправит её вторым AAC. Зрители слышат всё, в записи нет.<br>Только Twitch. YouTube и Kick игнорируют VOD-дорожку."
